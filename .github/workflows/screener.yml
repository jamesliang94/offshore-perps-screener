name: Offshore perps screener

on:
  schedule:
    - cron: "0 13 * * *"   # every day at 13:00 UTC (9am New York)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run screener
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          mkdir -p results
          FILE="results/$(date -u +%F).txt"
          echo "Run at $(date -u)" > "$FILE"
          python offshore_perps_screener.py >> "$FILE"
          cp "$FILE" results/latest.txt
          cat "$FILE"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "Screener results $(date -u +%F)" || echo "Nothing to commit"
          git push
